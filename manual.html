<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1117" />
    <base href="./" />
    <title>Move or Wait — How to use</title>
    <meta
      name="description"
      content="How to use Move or Wait: what the coloured verdict means, how to read the estimated wait, and what to set up before an earthquake."
    />
    <style>
      /* 画面 (index.html) と同じ色と字。マニュアルだけ別の見た目にすると、
         画面で見た帯とここに並ぶ帯が同じものだと分からなくなる。 */
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #14181d;
        --muted: #5f6b78;
        --line: #e3e7eb;
        --panel: #f5f7f9;

        --c-normal: #0b6b3a;
        --c-delay: #9a5b06;
        --c-wait: #a4231c;
        --c-avoid: #5a1016;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1117;
          --fg: #e9eef4;
          --muted: #9aa6b2;
          --line: #242c36;
          --panel: #161d26;
        }
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.65 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
        -webkit-text-size-adjust: 100%;
      }
      #doc { max-width: 34rem; margin-inline: auto; padding: 0 1rem 4rem; }

      a { color: inherit; text-underline-offset: .2em; }

      /* ── 見出し ── */
      .top {
        display: flex; align-items: flex-start; justify-content: space-between;
        gap: 1rem; padding: .9rem 0 .5rem;
      }
      .brand h1 { font-size: .95rem; margin: 0; letter-spacing: -.01em; }
      .brand p { margin: 0; color: var(--muted); font-size: .72rem; }
      .langs { display: flex; gap: .3rem; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
      .pill {
        background: none; border: 1px solid var(--line); color: var(--fg);
        padding: .25rem .5rem; font: inherit; font-size: .72rem;
        border-radius: .4rem; cursor: pointer;
      }
      .pill.on { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 600; }

      .lede { margin: .2rem 0 1.4rem; }
      .lede h2 {
        font-size: clamp(1.5rem, 6.5vw, 1.9rem); font-weight: 800;
        line-height: 1.15; letter-spacing: -.02em; margin: .4rem 0 .5rem;
      }
      .lede p { margin: 0; color: var(--muted); font-size: .92rem; }
      .openapp {
        display: inline-block; margin-top: 1rem;
        background: var(--fg); color: var(--bg); text-decoration: none;
        padding: .6rem 1rem; font-weight: 600; border-radius: .5rem; font-size: .9rem;
      }

      /* ── 目次 ── */
      nav.toc {
        border: 1px solid var(--line); border-radius: .7rem;
        padding: .8rem .9rem; margin-bottom: 2rem; background: var(--panel);
      }
      nav.toc ol { margin: 0; padding-left: 1.2rem; font-size: .88rem; }
      nav.toc li { margin: .2rem 0; }

      /* ── 本文 ── */
      section { margin-bottom: 2.4rem; scroll-margin-top: 1rem; }
      h2 {
        font-size: 1.15rem; letter-spacing: -.01em; margin: 0 0 .6rem;
        padding-bottom: .35rem; border-bottom: 2px solid var(--fg);
      }
      p { margin: 0 0 .8rem; }
      ul, ol { margin: 0 0 .9rem; padding-left: 1.3rem; }
      li { margin: .3rem 0; }
      strong { font-weight: 700; }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: .85em; background: var(--panel);
        padding: .1rem .3rem; border-radius: .25rem;
      }

      .note {
        border-left: 3px solid var(--c-delay);
        padding: .5rem 0 .5rem .8rem; margin: 0 0 .9rem;
        font-size: .92rem; color: var(--muted);
      }
      .note strong { color: var(--fg); }

      /* ── 判定帯の見本。画面に出るものと同じ形 ── */
      .band {
        border-radius: .7rem; padding: .7rem .85rem .8rem;
        color: #fff; margin-bottom: .55rem;
      }
      .v-normal { background: var(--c-normal); }
      .v-delay { background: var(--c-delay); }
      .v-wait { background: var(--c-wait); }
      .v-avoid-rail { background: var(--c-avoid); }
      .band strong { display: block; font-size: 1.02rem; font-weight: 800; letter-spacing: -.01em; }
      .band span { display: block; font-size: .82rem; opacity: .92; margin-top: .15rem; }
      .band em {
        display: block; font-style: normal; font-size: .82rem; font-weight: 600;
        margin: .5rem -.2rem -.2rem; padding: .4rem .55rem;
        background: rgba(255, 255, 255, .2); border-radius: .4rem;
      }

      /* ── 印 (チップ) ── */
      .chiplist { list-style: none; padding: 0; }
      .chiplist li {
        display: grid; grid-template-columns: 4.5rem 1fr; gap: .6rem;
        align-items: baseline; margin: .45rem 0; font-size: .9rem;
      }
      .chip {
        justify-self: start; color: #fff; font-size: .72rem; font-weight: 700;
        padding: .1rem .5rem; border-radius: 999px; white-space: nowrap;
      }
      .c-normal { background: var(--c-normal); }
      .c-delay { background: var(--c-delay); }
      .c-wait { background: var(--c-wait); }
      .c-avoid-rail { background: var(--c-avoid); }
      .c-unknown { background: var(--muted); }

      /* ── 手順 ── */
      ol.steps { list-style: none; padding: 0; counter-reset: s; }
      ol.steps li {
        counter-increment: s; position: relative;
        padding-left: 2rem; margin: .7rem 0;
      }
      ol.steps li::before {
        content: counter(s); position: absolute; left: 0; top: .1rem;
        width: 1.4rem; height: 1.4rem; border-radius: 50%;
        background: var(--fg); color: var(--bg);
        font-size: .78rem; font-weight: 700;
        display: grid; place-items: center;
      }
      ol.steps strong { display: block; }
      ol.steps span { display: block; font-size: .88rem; color: var(--muted); }

      /* ── 表 ── */
      .tablewrap { overflow-x: auto; margin: 0 0 .9rem; }
      table { border-collapse: collapse; width: 100%; font-size: .88rem; }
      th, td { text-align: left; padding: .45rem .6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
      th { color: var(--muted); font-size: .78rem; font-weight: 600; white-space: nowrap; }
      /* 震度のように短い見出し列は折らない。「6弱以/上」と切れると読みにくい。 */
      table.narrow td:first-child { white-space: nowrap; font-weight: 600; }

      /* ── よくある質問 ── */
      dl { margin: 0; }
      dt { font-weight: 700; margin-top: .9rem; }
      dd { margin: .15rem 0 0; color: var(--muted); }

      /* ── 試す ── */
      ul.trylist { list-style: none; padding: 0; }
      ul.trylist li {
        border: 1px solid var(--line); border-radius: .6rem;
        padding: .6rem .75rem; margin: .5rem 0;
      }
      ul.trylist a { font-weight: 600; }
      ul.trylist span { display: block; font-size: .84rem; color: var(--muted); margin-top: .1rem; }

      footer {
        border-top: 1px solid var(--line); padding-top: 1rem;
        font-size: .74rem; color: var(--muted);
      }
      footer p { margin: 0 0 .4rem; }
    </style>
  </head>
  <body>
    <main id="doc"></main>

                    ['위치 정보를 허용하지 않으면 못 쓰나요.', '쓸 수 있습니다. 설정에서 역을 검색하세요. 숙소와 출국 항공편만으로도 판단할 수 있습니다.'],
                    ['알림이 오나요.', '오지 않습니다. 지진 후 직접 여는 것을 전제로 합니다. 그래서 설정이 포함된 링크를 저장해 두세요.'],
                    ['가입이나 로그인이 필요한가요.', '없습니다. 설정은 기기와 URL에만 남습니다.'],
                    ['왜 진도를 크게 보여 주지 않나요.', '진도 자체는 판단 재료가 되지 않기 때문입니다. 필요하면 노선 내역에 나옵니다.'],
                    ['신칸센이나 비행기는 알 수 있나요.', '신칸센은 노선으로 나옵니다. 항공편의 지연·결항은 낼 수 없습니다. 항공사에 확인하세요.'],
                    ['이 예상은 맞나요.', '범위로 냅니다. 실제 재개는 점검 결과에 달려 있습니다. 철도 회사의 운행 정보를 받으면 그것으로 덮어씁니다.'],
                  ],
                },
              ],
            },
          ],
          sourcesLabel: '출처',
          sources:
            '기상청 / P2P지진정보 / 국토수치정보(철도 데이터) CC BY 4.0 / 공공교통 오픈데이터 센터 / 국토지리원(지정 긴급 대피 장소·지리원 타일·역지오코더) / 도쿄도 오픈데이터 카탈로그(일시 체류 시설) CC BY 4.0 / 다카하마·미도리카와 (2011) 일본지진공학회 논문집 11(2)',
          disclaimer:
            '이것은 추정입니다. 철도 회사는 자체 선로변 지진계로 판단하며, 여기서 쓰는 수치와는 다릅니다. 움직이기 전에 반드시 사업자나 역무원에게 확인하세요.',
        },
      }

      // ── 描画 ────────────────────────────────────────────────

      const esc = (s) =>
        String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])

      /** 本文の中の **強調** と `コード` だけ拾う。書きやすさのため。 */
      const md = (s) =>
        esc(s)
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          .replace(/`(.+?)`/g, '<code>$1</code>')

      function block(b, lang) {
        if (b.p) return `<p>${md(b.p)}</p>`
        if (b.note) return `<p class="note">${md(b.note)}</p>`
        if (b.ul) return `<ul>${b.ul.map((i) => `<li>${md(i)}</li>`).join('')}</ul>`
        if (b.steps) {
          return `<ol class="steps">${b.steps
            .map(([t, d]) => `<li><strong>${md(t)}</strong>${d ? `<span>${md(d)}</span>` : ''}</li>`)
            .join('')}</ol>`
        }
        if (b.bands) {
          return b.bands
            .map(
              ([cls, status, lead, act]) =>
                `<div class="band ${cls}"><strong>${esc(status)}</strong><span>${esc(lead)}</span><em>${esc(act)}</em></div>`,
            )
            .join('')
        }
        if (b.chips) {
          return `<ul class="chiplist">${b.chips
            .map(([cls, label, desc]) => `<li><span class="chip ${cls}">${esc(label)}</span><span>${esc(desc)}</span></li>`)
            .join('')}</ul>`
        }
        if (b.table) {
          const head = b.table.head.map((h) => `<th>${esc(h)}</th>`).join('')
          const rows = b.table.rows
            .map((r) => `<tr>${r.map((c) => `<td>${md(c)}</td>`).join('')}</tr>`)
            .join('')
          return `<div class="tablewrap"><table class="${b.table.narrow ? 'narrow' : ''}"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>`
        }
        if (b.qa) {
          return `<dl>${b.qa.map(([q, a]) => `<dt>${md(q)}</dt><dd>${md(a)}</dd>`).join('')}</dl>`
        }
        if (b.links) {
          return `<ul class="trylist">${b.links
            .map(([label, href, note]) => {
              const url = typeof href === 'function' ? href(lang) : href[lang] ?? href
              return `<li><a href="${esc(url)}">${esc(label)}</a><span>${esc(note)}</span></li>`
            })
            .join('')}</ul>`
        }
        return ''
      }

      function render(lang) {
        const s = CONTENT[lang]
        document.documentElement.lang = lang
        document.title = s.docTitle

        const langs = LANGS.map(
          (l) => `<button class="pill${l.code === lang ? ' on' : ''}" data-lang="${l.code}">${esc(l.label)}</button>`,
        ).join('')

        const toc = s.sections
          .map((sec) => `<li><a href="#${sec.id}">${esc(sec.h)}</a></li>`)
          .join('')

        const body = s.sections
          .map(
            (sec) =>
              `<section id="${sec.id}"><h2>${esc(sec.h)}</h2>${sec.blocks.map((b) => block(b, lang)).join('')}</section>`,
          )
          .join('')

        document.getElementById('doc').innerHTML = `
          <header class="top">
            <div class="brand">
              <h1>${esc(s.appName)}</h1>
              <p>${esc(s.tagline)}</p>
            </div>
            <div class="langs">${langs}</div>
          </header>

          <div class="lede">
            <h2>${esc(s.title)}</h2>
            <p>${esc(s.lede)}</p>
            <a class="openapp" href="index.html?lang=${lang}">${esc(s.openApp)}</a>
          </div>

          <nav class="toc"><strong>${esc(s.toc)}</strong><ol>${toc}</ol></nav>

          ${body}

          <footer>
            <p>${esc(s.disclaimer)}</p>
            <p>${esc(s.sourcesLabel)}: ${esc(s.sources)}</p>
          </footer>`

        for (const btn of document.querySelectorAll('[data-lang]')) {
          btn.addEventListener('click', () => {
            const url = new URL(location.href)
            url.searchParams.set('lang', btn.dataset.lang)
            history.replaceState(null, '', url)
            render(btn.dataset.lang)
            window.scrollTo(0, 0)
          })
        }
      }

      /**
       * 言語の決め方。URL → アプリの保存済み設定 → 端末の言語。
       *
       * アプリ側の設定を読むだけで、書き戻さない。マニュアルで一時的に
       * 英語にしただけで、アプリの言語まで変わったら驚く。
       */
      function initialLang() {
        const q = new URLSearchParams(location.search).get('lang')
        if (q && CONTENT[q]) return q
        try {
          const saved = JSON.parse(localStorage.getItem('config') ?? '{}')
          if (saved.lang && CONTENT[saved.lang]) return saved.lang
        } catch {
          // 読めなくても端末の言語で出せる。
        }
        for (const raw of navigator.languages ?? [navigator.language]) {
          const l = String(raw).toLowerCase()
          if (l.startsWith('ja')) return 'ja'
          if (l.startsWith('zh')) return 'zh'
          if (l.startsWith('ko')) return 'ko'
          if (l.startsWith('en')) return 'en'
        }
        return 'en'
      }

      render(initialLang())

      // アプリと同じ Service Worker に載せる。圏外でもマニュアルは読める。
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {})
      }
    </script>
  </body>
</html>
