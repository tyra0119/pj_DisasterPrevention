<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Pages のプロジェクトページは /<repo>/ 配下に載る。相対基準にしておくと
         ローカルの http-server でも同じ URL 解決になる。 -->
    <base href="./" />
    <title>診断 — 震度 → 路線 割り当て</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; padding: 1.25rem;
        font: 15px/1.6 system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif;
        max-width: 60rem; margin-inline: auto;
      }
      h1 { font-size: 1.1rem; margin: 0 0 .25rem; }
      .sub { opacity: .7; font-size: .85rem; margin: 0 0 1.25rem; }
      .card { border: 1px solid color-mix(in srgb, currentColor 20%, transparent);
              border-radius: 8px; padding: .9rem 1rem; margin-bottom: 1rem; }
      .card h2 { font-size: .9rem; margin: 0 0 .6rem; opacity: .8; font-weight: 600; }
      dl { display: grid; grid-template-columns: max-content 1fr; gap: .2rem .9rem; margin: 0; }
      dt { opacity: .65; }
      dd { margin: 0; }
      table { border-collapse: collapse; width: 100%; font-size: .88rem; }
      th, td { text-align: left; padding: .3rem .5rem; border-bottom: 1px solid
               color-mix(in srgb, currentColor 12%, transparent); white-space: nowrap; }
      th { opacity: .6; font-weight: 600; }
      td.level { font-variant-numeric: tabular-nums; font-weight: 700; }
      .wrap { overflow-x: auto; }
      .muted { opacity: .55; }
      footer { font-size: .78rem; opacity: .6; margin-top: 2rem; }
      code { font-size: .85em; }
    </style>
  </head>
  <body>
    <h1>診断 — 震度 → 路線 割り当て</h1>
    <p class="sub">
      データ経路が実ブラウザで通ることを確かめるためのページ。
      直近で一番強かった地震を取り、全路線に震度を割り当てる。
      アプリ本体は <a href="./">こちら</a>。
    </p>

    <div class="card" id="status"><h2>状態</h2><p>読み込み中…</p></div>
    <div class="card" id="event" hidden></div>
    <div class="card" id="airports" hidden></div>
    <div class="card" id="lines" hidden></div>

    <footer>
      出典: 国土数値情報（鉄道データ）国土交通省 — CC BY 4.0 ／
      気象庁 震度観測点一覧表 ／ P2P地震情報 API v2
    </footer>

    <script type="module">
      import { loadIndex } from './src/quake/stations.js'
      import { fetchRecent } from './src/quake/p2p.js'
      import { prepareField } from './src/quake/field.js'
      import { SHINDO_ORDER } from './src/quake/types.js'
      import { loadRailData } from './src/rail/lines.js'
      import { assignToLines } from './src/rail/assign.js'

      const $ = (id) => document.getElementById(id)
      const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c])
      const show = (el, html) => { el.innerHTML = html; el.hidden = false }

      // 最終取得時刻は必ず出す。オフラインでも「いつの情報か」が分からないと判断できない。
      const stamp = (d) =>
        new Intl.DateTimeFormat('ja-JP', { dateStyle: 'short', timeStyle: 'medium', timeZone: 'Asia/Tokyo' }).format(d)

      const AIRPORT_LINES = [
        ['京成電鉄', '成田空港線'],
        ['東日本旅客鉄道', '成田線'],
        ['東京モノレール', '東京モノレール羽田空港線'],
        ['京浜急行電鉄', '空港線'],
        ['南海電気鉄道', '空港線'],
        ['西日本旅客鉄道', '関西空港線'],
      ]

      try {
        const t0 = performance.now()
        const [index, rail] = await Promise.all([loadIndex(), loadRailData()])
        const loadedMs = performance.now() - t0

        const events = (await fetchRecent(index, { limit: 100 }))
          .filter((e) => e.resolution === 'station' && e.maxLevel)
          .sort((a, b) => SHINDO_ORDER[b.maxLevel] - SHINDO_ORDER[a.maxLevel])
        const fetchedAt = new Date()

        if (!events.length) {
          show($('status'), '<h2>状態</h2><p>直近 100 件に観測点単位の地震情報がなかった。</p>')
          throw new Error('no station-resolution event')
        }

        const event = events[0]
        const t1 = performance.now()
        const impacts = assignToLines(prepareField(event, index), rail.lines, { radiusKm: 20 })
        const assignMs = performance.now() - t1

        const points = rail.lines.reduce((n, l) => n + l.stations.length + l.track.length, 0)
        show($('status'), `<h2>状態</h2><dl>
          <dt>取得時刻</dt><dd>${stamp(fetchedAt)}</dd>
          <dt>データ読込</dt><dd>${loadedMs.toFixed(0)}ms（観測点 ${index.stations.length} 点 / ${rail.count} 路線 ${points} 地点）</dd>
          <dt>割り当て</dt><dd>${assignMs.toFixed(0)}ms</dd>
          <dt>座標が引けなかった観測点</dt><dd>${event.unresolved.length}</dd>
        </dl>`)

        show($('event'), `<h2>対象の地震（直近で最も強いもの）</h2><dl>
          <dt>震源</dt><dd>${esc(event.hypocenter.name)}</dd>
          <dt>発生</dt><dd>${esc(event.occurredAt)}</dd>
          <dt>規模</dt><dd>M${event.magnitude ?? '—'} / 最大震度 ${event.maxLevel}</dd>
          <dt>観測点</dt><dd>${event.observations.length} 点</dd>
        </dl>`)

        const find = (op, name) => impacts.find((i) => i.line.operator === op && i.line.name === name)
        show($('airports'), `<h2>空港アクセス</h2><div class="wrap"><table>
          <tr><th>路線</th><th>震度</th><th>判定</th><th>最大の地点</th></tr>
          ${AIRPORT_LINES.map(([op, name]) => {
            const i = find(op, name)
            if (!i) return `<tr><td>${esc(op)} ${esc(name)}</td><td colspan="3" class="muted">見つからない</td></tr>`
            return `<tr><td>${esc(op)} ${esc(name)}</td>
              <td class="level">${i.level ?? '—'}</td>
              <td class="${i.level ? '' : 'muted'}">${i.confidence === 'reported' ? '観測' : i.confidence === 'below-threshold' ? '震度1未満' : '判定不能'}</td>
              <td>${esc(i.at?.label ?? '—')}</td></tr>`
          }).join('')}
        </table></div>`)

        const shaken = impacts.filter((i) => i.level)
        show($('lines'), `<h2>揺れた路線 ${shaken.length} / ${impacts.length}（強い順 上位 25）</h2><div class="wrap"><table>
          <tr><th>震度</th><th>事業者</th><th>路線</th><th>最大の地点</th><th>根拠の観測点</th></tr>
          ${shaken.slice(0, 25).map((i) => `<tr>
            <td class="level">${i.level}</td>
            <td>${esc(i.line.operator)}</td>
            <td>${esc(i.line.name)}</td>
            <td>${esc(i.at?.label ?? '—')}</td>
            <td class="muted">${esc(i.source?.label ?? '—')} ${i.source ? i.source.distanceKm.toFixed(1) + 'km' : ''}</td>
          </tr>`).join('')}
        </table></div>`)
      } catch (err) {
        $('status').innerHTML = `<h2>状態</h2><p>失敗: <code>${esc(err.message)}</code></p>`
        throw err
      }
    </script>
  </body>
</html>
