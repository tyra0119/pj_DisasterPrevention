<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1117" />
    <!-- Pages のプロジェクトページは /<repo>/ 配下に載る。相対基準にしておくと
         ローカルの http-server でも同じ URL 解決になる。 -->
    <base href="./" />
    <title>Move or Wait</title>
    <meta
      name="description"
      content="After an earthquake in Japan, see whether the trains you need are running — and whether to move or wait. English and Japanese."
    />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #14181d;
        --muted: #5f6b78;
        --line: #e3e7eb;
        --panel: #f5f7f9;

        /* 判定の色は明暗テーマで変えない。白抜きの塗りなのでどちらでも読める。
           緊急時は「いつもと同じ色」であることの方が、テーマへの馴染みより大事。 */
        --c-normal: #0b6b3a;
        --c-delay: #9a5b06;
        --c-wait: #a4231c;
        --c-avoid: #5a1016;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1117;
          --fg: #e9eef4;
          --muted: #9aa6b2;
          --line: #242c36;
          --panel: #161d26;
        }
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.55 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
        -webkit-text-size-adjust: 100%;
      }
      #app { max-width: 32rem; margin-inline: auto; padding: 0 1rem 3rem; }

      button { font: inherit; cursor: pointer; }
      button.link {
        background: none; border: 0; color: var(--muted);
        text-decoration: underline; text-underline-offset: .2em;
        padding: .25rem 0; font-size: .82rem;
      }
      button.lang {
        background: none; border: 1px solid var(--line); color: var(--fg);
        padding: .25rem .55rem; font-size: .75rem; border-radius: .4rem;
      }
      button.primary {
        background: var(--fg); color: var(--bg); border: 0;
        padding: .6rem 1rem; font-weight: 600; border-radius: .5rem;
      }

      /* ── 見出し。名前は小さく。画面の上は判定に使う ── */
      .top {
        display: flex; align-items: center; justify-content: space-between;
        gap: 1rem; padding: .9rem 0 .75rem;
      }
      .brand h1 { font-size: .95rem; margin: 0; letter-spacing: -.01em; }
      .brand p { margin: 0; color: var(--muted); font-size: .72rem; }
      .controls { display: flex; gap: .6rem; align-items: center; flex-shrink: 0; }

      /* ── 判定帯。ここだけ読めば動くか待つかが分かる ── */
      .verdict {
        border-radius: .9rem;
        padding: 1.1rem 1.1rem 1.2rem;
        color: #fff;
        margin-bottom: .9rem;
      }
      .v-normal { background: var(--c-normal); }
      .v-delay { background: var(--c-delay); }
      .v-wait { background: var(--c-wait); }
      .v-avoid-rail { background: var(--c-avoid); }
      .v-unset {
        background: var(--panel); color: var(--fg);
        border: 1px solid var(--line);
      }

      .v-status {
        margin: 0;
        font-size: clamp(1.55rem, 7.5vw, 2.05rem);
        font-weight: 800;
        line-height: 1.12;
        letter-spacing: -.02em;
      }
      .v-lead { margin: .5rem 0 0; font-size: .92rem; opacity: .92; }
      /* 判定帯の背景 .v-wait と名前が衝突しないよう .v-eta にしてある。 */
      .v-eta {
        margin: .7rem 0 0; font-size: 1.1rem; font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      /* 決断。ここが判定帯の結び。待つのか、寝場所を探すのか。 */
      .v-act {
        margin: .9rem -.35rem -.35rem; padding: .65rem .75rem;
        background: rgba(255, 255, 255, .2);
        border-radius: .5rem; font-size: .88rem;
      }
      .v-act strong { display: block; font-size: .98rem; }
      .v-act span { display: block; margin-top: .2rem; opacity: .9; }
      .v-unset .v-lead { opacity: 1; font-size: 1rem; }

      /* ── 地震の 1 行 ── */
      .quake {
        margin: 0 0 1rem; font-size: .8rem; color: var(--muted);
        display: flex; flex-wrap: wrap; gap: .25rem .6rem;
      }
      .quake.past { color: var(--c-delay); font-weight: 600; }
      .past-note { flex-basis: 100%; }

      /* ── 場所の一覧 ── */
      ul.places { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
      .place { border-bottom: 1px solid var(--line); }
      .prow {
        width: 100%; display: grid;
        grid-template-columns: 1fr auto auto; grid-template-rows: auto auto;
        gap: .1rem .75rem; align-items: center;
        background: none; border: 0; color: inherit;
        padding: .8rem .15rem; text-align: left;
      }
      .p-label {
        grid-column: 1; grid-row: 1;
        font-size: .68rem; letter-spacing: .07em; text-transform: uppercase;
        color: var(--muted); font-weight: 600;
      }
      .p-name { grid-column: 1; grid-row: 2; font-size: 1rem; font-weight: 600; }
      .p-name.muted { color: var(--muted); font-weight: 400; }
      .prow .chip { grid-column: 2; grid-row: 1 / span 2; }
      .chev {
        grid-column: 3; grid-row: 1 / span 2;
        color: var(--muted); font-size: 1.1rem; width: 1rem; text-align: center;
      }
      .p-extra { margin: -.3rem .15rem .7rem; font-size: .82rem; color: var(--muted); }

      .chip {
        display: inline-block; padding: .2rem .55rem; border-radius: 999px;
        font-size: .72rem; font-weight: 700; color: #fff; white-space: nowrap;
      }
      .c-normal { background: var(--c-normal); }
      .c-delay { background: var(--c-delay); }
      .c-wait { background: var(--c-wait); }
      .c-avoid-rail { background: var(--c-avoid); }
      .c-unset { background: none; color: var(--muted); border: 1px solid var(--line); font-weight: 600; }

      ul.lines { list-style: none; margin: 0 0 .8rem; padding: 0; }
      /* 行の下に内訳が開くので、li は縦積み。
         横並び (flex) のままだと、行と内訳が横に並んで行が潰れ、
         閉じるボタンが押せなくなる。 */
      ul.lines li { display: block; }
      ul.lines li + li { border-top: 1px solid var(--line); }
      .lnrow {
        width: 100%; display: grid;
        grid-template-columns: 1fr auto auto; gap: .1rem .7rem;
        align-items: center; text-align: left;
        background: none; border: 0; color: inherit;
        padding: .5rem .15rem; font-size: .87rem;
      }
      .lnrow .ln { min-width: 0; }
      .lnrow .chip { justify-self: end; }
      .lnrow .chev {
        grid-column: 3; grid-row: auto;
        color: var(--muted); font-size: 1rem; width: .9rem; text-align: center;
      }
      /* 遠くで止まっている路線に添える場所。判定が平常なのに不通が並ぶ理由。 */
      .ln-where { display: block; font-size: .74rem; color: var(--muted); }

      /* 推定の内訳。数字を出す以上、どこから来た数字かを見せる。 */
      .lndetail { padding: 0 .15rem .7rem; }
      .lndetail dl {
        display: grid; grid-template-columns: max-content minmax(0, 1fr);
        gap: .2rem .7rem; margin: 0 0 .5rem; font-size: .8rem;
      }
      .lndetail dt { color: var(--muted); }
      .lndetail dd { margin: 0; overflow-wrap: anywhere; }
      .lndetail .muted { color: var(--muted); }
      .lndetail .src { display: block; font-size: .74rem; }
      .lndetail .hint { font-size: .76rem; margin: 0 0 .35rem; }

      .panel { padding: .2rem .15rem 1rem; }
      .panel .hint, .settings .hint { margin: 0 0 .6rem; font-size: .82rem; color: var(--muted); }
      .rowacts { display: flex; flex-wrap: wrap; gap: .5rem; margin: .2rem 0 .8rem; }
      /* 住所は人に見せるもの。読める大きさで、選んでコピーできるようにする。 */
      .addr { margin: 0 0 .6rem; user-select: text; }
      .addr-main { display: block; font-size: .95rem; font-weight: 600; }
      .addr-sub { display: block; font-size: .74rem; color: var(--muted); font-variant-numeric: tabular-nums; }
      .field { margin-bottom: .7rem; }
      .field label {
        display: block; margin-bottom: .25rem;
        font-size: .7rem; letter-spacing: .06em; text-transform: uppercase;
        color: var(--muted); font-weight: 600;
      }
      .field select, .field input {
        width: 100%; font: inherit; padding: .55rem .7rem;
        border: 1px solid var(--line); border-radius: .5rem;
        background: var(--bg); color: var(--fg);
      }

      /* 小さな操作ボタン。行の中に置くので、主役にならない大きさにする。 */
      .pill {
        background: none; border: 1px solid var(--line); color: var(--fg);
        padding: .4rem .8rem; border-radius: 999px; font-size: .82rem;
      }
      .pill.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 600; }
      .pill.on { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 600; }

      /* ── 駅の候補 ──────────────────────────────────────────
         読む結果ではなく、選ぶメニュー。カードを並べるとひとつずつが
         判定と同じ重さになり、下の内容を押し出してしまう。
         1 枚の面を欄の真下に浮かせ、罫線で区切る。 */
      .hitwrap { position: relative; }
      .hitwrap input {
        width: 100%; font: inherit; padding: .6rem .7rem;
        border: 1px solid var(--line); border-radius: .5rem;
        background: var(--bg); color: var(--fg);
      }
      .hitwrap input.hasHits { border-radius: .5rem .5rem 0 0; }
      .hits:empty { display: none; }
      .hits {
        position: absolute; left: 0; right: 0; top: 100%; z-index: 15;
        max-height: min(46vh, 320px); overflow-y: auto;
        background: var(--bg); border: 1px solid var(--line); border-top: 0;
        border-radius: 0 0 .5rem .5rem;
        box-shadow: 0 10px 24px rgba(0, 0, 0, .16);
      }
      button.hit {
        display: block; width: 100%; text-align: left;
        font: inherit; color: inherit; cursor: pointer;
        background: none; border: 0; border-top: 1px solid var(--line);
        padding: .5rem .7rem;
      }
      button.hit:first-child { border-top: 0; }
      button.hit:hover, button.hit:focus { background: var(--panel); }
      .hit-main { display: block; font-size: .92rem; }
      .hit-sub { display: block; font-size: .76rem; color: var(--muted); }
      .hit-empty { margin: 0; padding: .6rem .7rem; font-size: .85rem; color: var(--muted); }

      /* ── 地図 ──
         地理院タイルを並べただけ。動かせない代わりに、圏外でも消えない
         (タイルは出ないが、下の一覧と距離は残る)。 */
      .mapbtn { display: inline-block; margin: -.5rem 0 .9rem; }
      .map {
        position: relative; overflow: hidden;
        border: 1px solid var(--line); border-radius: .6rem;
        background: var(--panel); margin: 0 0 .7rem;
      }
      .map-inner {
        position: absolute; inset: 0;
        cursor: grab; touch-action: none; user-select: none;
      }
      .map.dragging .map-inner { cursor: grabbing; }
      .map img { position: absolute; width: 256px; height: 256px; pointer-events: none; }

      /* 操作ボタン。地図の上に重ねる。指で押せる大きさにする。 */
      .map-ctl {
        position: absolute; right: .4rem; top: .4rem; z-index: 4;
        display: flex; flex-direction: column; gap: .25rem;
      }
      .map-ctl button {
        width: 2rem; height: 2rem; line-height: 1;
        font-size: 1rem; border-radius: .45rem;
        border: 1px solid rgba(0, 0, 0, .18);
        background: rgba(255, 255, 255, .94); color: #222;
        box-shadow: 0 1px 3px rgba(0, 0, 0, .25);
        display: flex; align-items: center; justify-content: center;
      }
      .map-ctl button:active { background: #e9edf1; }
      .map-note {
        position: absolute; right: 0; bottom: 0; z-index: 3;
        background: rgba(255, 255, 255, .82); color: #333;
        font-size: .62rem; padding: .1rem .35rem; border-radius: .3rem 0 0 0;
      }
      .pin {
        position: absolute; z-index: 2; transform: translate(-50%, -50%);
        width: 1.35rem; height: 1.35rem; border-radius: 999px;
        border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .45);
        display: flex; align-items: center; justify-content: center;
      }
      .pin b { font-size: .62rem; color: #fff; font-weight: 700; line-height: 1; }
      .pin-quake { background: var(--c-wait); }
      .pin-me { background: #1c5fd0; }
      .pin-shelter { background: var(--c-normal); }
      /* 一時滞在施設は逃げ場ではなく休み場。色を分ける。 */
      .pin-stay { background: #1a5fb4; }
      .sh-stay { background: #1a5fb4; }
      .sh-shelter { background: var(--c-normal); }
      /* 震源と現在地は名札を横に出す。丸の中には入らない。 */
      .pin-quake b, .pin-me b {
        position: absolute; left: 50%; top: 100%; transform: translateX(-50%);
        margin-top: .2rem; white-space: nowrap;
        background: rgba(0, 0, 0, .68); padding: .05rem .3rem; border-radius: .25rem;
      }

      /* 「まず動かない」は避難場所の一覧より先に読ませたい。 */
      .warn-note {
        border-left: 3px solid var(--c-delay); padding-left: .6rem;
        color: var(--fg) !important;
      }
      ul.shelters { list-style: none; margin: 0; padding: 0; }
      ul.shelters li {
        display: grid; grid-template-columns: auto 1fr auto;
        gap: .1rem .6rem; align-items: center;
        padding: .5rem .15rem; border-top: 1px solid var(--line);
      }
      .subhead {
        margin: 1.2rem 0 .4rem; font-size: .74rem; font-weight: 700;
        letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
        padding-top: .8rem; border-top: 1px solid var(--line);
      }
      .sh-no {
        width: 1.35rem; height: 1.35rem; border-radius: 999px;
        background: var(--c-normal); color: #fff;
        font-size: .7rem; font-weight: 700;
        display: flex; align-items: center; justify-content: center;
      }
      .sh-name { display: block; font-size: .9rem; font-weight: 600; }
      .sh-sub { display: block; font-size: .74rem; color: var(--muted); }
      .sh-go { font-size: .78rem; white-space: nowrap; }

      /* ── 設定ダイアログ ──
         画面全体にかかる設定だけを置く。場所ごとの設定はその場所の行の中にある。 */
      dialog#settings {
        border: 0; border-radius: .9rem; padding: 0;
        width: min(24rem, calc(100vw - 2rem));
        background: var(--bg); color: var(--fg);
        box-shadow: 0 20px 50px rgba(0, 0, 0, .3);
      }
      dialog#settings::backdrop { background: rgba(0, 0, 0, .45); }
      .dlg-head {
        display: flex; align-items: center; justify-content: space-between;
        padding: .9rem 1rem; border-bottom: 1px solid var(--line);
      }
      .dlg-head h2 { font-size: .95rem; margin: 0; }
      .dlg-head .x {
        background: none; border: 0; color: var(--muted);
        font-size: 1.4rem; line-height: 1; padding: 0 .2rem; cursor: pointer;
      }
      .dlg-body { padding: .4rem 1rem 1.1rem; }
      .dlg-body label {
        display: block; margin: .9rem 0 .4rem;
        font-size: .7rem; letter-spacing: .06em; text-transform: uppercase;
        color: var(--muted); font-weight: 600;
      }

      /* ── 取得時刻。オフラインかどうかは必ず見える ── */
      .stamp {
        display: flex; flex-wrap: wrap; align-items: baseline; gap: .5rem;
        margin: 1.1rem 0 0; font-size: .74rem; color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .stamp .warn { color: var(--c-delay); font-weight: 700; }

      .caveat {
        margin-top: 1.6rem; padding-top: 1rem;
        border-top: 1px solid var(--line); color: var(--muted); font-size: .76rem;
      }
      .caveat h2 { font-size: .76rem; margin: 0 0 .3rem; color: var(--fg); }
      .caveat p { margin: 0 0 .5rem; }
      .caveat .src { font-size: .7rem; }
      a { color: inherit; }

      /* ── テスト表示。見落とされたら事故になるので、色も位置も譲らない ── */
      .testbar {
        position: sticky; top: 0; z-index: 10;
        margin: 0 -1rem; padding: .7rem 1rem;
        background: var(--c-wait); color: #fff;
        display: flex; flex-wrap: wrap; gap: .3rem .75rem; align-items: baseline;
        font-size: .78rem; line-height: 1.4;
      }
      .testbar strong { font-size: .82rem; }
      .testbar button.link { color: #fff; }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module">
      import { start } from './src/app/main.js'
      start()

      // オフライン対応。地震のあとは回線が細るので、同梱データは端末に残す。
      if ('serviceWorker' in navigator) {
        // updateViaCache: 'none' で sw.js 自体は必ず取りに行く。
        // これが無いと、古い Service Worker が居座って新しい画面が届かない。
        navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {
          // 登録できなくてもオンラインなら動く。
        })

        // 新しい版が有効になったら 1 度だけ読み直す。
        // 二重に読み直して無限ループにならないよう、印を付けてから遷移する。
        navigator.serviceWorker.addEventListener('message', (ev) => {
          if (ev.data?.type !== 'sw-updated') return
          if (sessionStorage.getItem('sw-reloaded') === ev.data.version) return
          sessionStorage.setItem('sw-reloaded', ev.data.version)
          location.reload()
        })
      }
    </script>
  </body>
</html>
