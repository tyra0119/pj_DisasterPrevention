<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1117" />
    <!-- Pages のプロジェクトページは /<repo>/ 配下に載る。相対基準にしておくと
         ローカルの http-server でも同じ URL 解決になる。 -->
    <base href="./" />
    <title>Can I Get Back?</title>
    <meta
      name="description"
      content="After an earthquake in Japan, find out whether the trains you need are likely running — in plain terms, in English or Japanese."
    />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #14181d;
        --muted: #5b6672;
        --line: #e2e6ea;
        --card: #f7f9fa;
        --ok: #1a7f4b;
        --ok-bg: #e8f6ee;
        --warn: #9a6100;
        --warn-bg: #fdf3e0;
        --stop: #b3261e;
        --stop-bg: #fdecea;
        --grave: #6a1b9a;
        --grave-bg: #f4e9f8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1117;
          --fg: #e7edf3;
          --muted: #97a3b0;
          --line: #232a33;
          --card: #151b23;
          --ok: #56d18b;
          --ok-bg: #10241a;
          --warn: #e8b45a;
          --warn-bg: #26200f;
          --stop: #ff8a80;
          --stop-bg: #2a1516;
          --grave: #d8a8f0;
          --grave-bg: #23162b;
        }
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.6 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
        -webkit-text-size-adjust: 100%;
      }
      #app {
        max-width: 34rem;
        margin-inline: auto;
        padding: 1rem 1rem 3rem;
      }

      header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 1rem;
        padding-block: .5rem 1rem;
      }
      .brand h1 { font-size: 1.35rem; margin: 0; letter-spacing: -.01em; }
      .brand p { margin: .15rem 0 0; color: var(--muted); font-size: .85rem; }
      .controls { display: flex; gap: .5rem; align-items: center; flex-shrink: 0; }

      button {
        font: inherit;
        cursor: pointer;
        border-radius: .5rem;
      }
      button.link {
        background: none;
        border: 0;
        color: var(--muted);
        text-decoration: underline;
        text-underline-offset: .2em;
        padding: .25rem 0;
        font-size: .85rem;
      }
      button.lang {
        background: none;
        border: 1px solid var(--line);
        color: var(--fg);
        padding: .3rem .6rem;
        font-size: .8rem;
      }
      button.primary {
        background: var(--fg);
        color: var(--bg);
        border: 0;
        padding: .6rem 1rem;
        font-weight: 600;
      }

      .stamp {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: .5rem;
        margin: 0 0 1rem;
        font-size: .78rem;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .stamp .warn { color: var(--warn); font-weight: 600; }

      .quake {
        border-left: 3px solid var(--line);
        padding-left: .75rem;
        margin-bottom: 1rem;
      }
      .quake p { margin: 0; font-size: .9rem; color: var(--muted); }
      .quake.past { border-left-color: var(--warn); }
      .past-note { color: var(--warn) !important; font-weight: 600; margin-top: .25rem !important; }

      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: .75rem;
        padding: 1rem;
        margin-bottom: .85rem;
      }
      .card h2 {
        font-size: .78rem;
        margin: 0 0 .5rem;
        color: var(--muted);
        font-weight: 600;
        letter-spacing: .06em;
        text-transform: uppercase;
      }
      .where { margin: 0 0 .35rem; font-size: .95rem; font-weight: 600; }
      .verdict { margin: 0; font-size: 1.3rem; font-weight: 700; line-height: 1.3; }
      .detail { margin: .35rem 0 0; color: var(--muted); font-size: .9rem; }
      .note { margin: .35rem 0 0; font-size: .85rem; color: var(--muted); }

      /* 結論の重さを色で。数値ではなく色と言葉で判断できるように。 */
      .adv-normal { border-left: 4px solid var(--ok); }
      .adv-normal .verdict { color: var(--ok); }
      .adv-delay { border-left: 4px solid var(--warn); background: var(--warn-bg); }
      .adv-delay .verdict { color: var(--warn); }
      .adv-wait { border-left: 4px solid var(--stop); background: var(--stop-bg); }
      .adv-wait .verdict { color: var(--stop); }
      .adv-avoid-rail { border-left: 4px solid var(--grave); background: var(--grave-bg); }
      .adv-avoid-rail .verdict { color: var(--grave); }

      ul.lines { list-style: none; margin: .6rem 0 0; padding: 0; }
      ul.lines li {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: .75rem;
        padding: .35rem 0;
        border-top: 1px solid var(--line);
        font-size: .88rem;
      }
      .tag { font-size: .72rem; white-space: nowrap; color: var(--muted); }
      .tag.t-wait { color: var(--stop); }
      .tag.t-delay { color: var(--warn); }
      .tag.t-normal { color: var(--ok); }
      .tag.t-avoid-rail { color: var(--grave); }

      .picker { margin-top: .75rem; }
      .picker input, .settings input, .settings select {
        width: 100%;
        font: inherit;
        padding: .55rem .7rem;
        border: 1px solid var(--line);
        border-radius: .5rem;
        background: var(--bg);
        color: var(--fg);
      }
      #here-results { list-style: none; margin: .5rem 0 0; padding: 0; }
      #here-results li { border-top: 1px solid var(--line); }
      #here-results button {
        width: 100%;
        text-align: left;
        background: none;
        border: 0;
        color: var(--fg);
        padding: .5rem 0;
        font-size: .9rem;
      }

      .settings label {
        display: block;
        margin: .9rem 0 .3rem;
        font-size: .78rem;
        color: var(--muted);
        font-weight: 600;
      }
      .row { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; margin-top: .9rem; }

      .caveat {
        margin-top: 2rem;
        padding-top: 1rem;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: .78rem;
      }
      .caveat h2 { font-size: .78rem; margin: 0 0 .3rem; color: var(--fg); }
      .caveat p { margin: 0 0 .5rem; }
      .caveat .src { font-size: .72rem; }
      a { color: inherit; }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module">
      import { start } from './src/app/main.js'
      start()

      // オフライン対応。地震のあとは回線が細るので、同梱データは端末に残す。
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(() => {
          // 登録できなくてもオンラインなら動く。
        })
      }
    </script>
  </body>
</html>
